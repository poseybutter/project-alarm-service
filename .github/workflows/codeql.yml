name: CodeQL Security Scan

# develop push 는 트리거하지 않는다 — develop 으로 들어오는 변경은 전부 PR 을 거치므로
# pull_request 분석과 같은 커밋을 중복 분석하고 "CodeQL: skipping" 체크 소음만 만든다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  schedule:
    # 매주 월요일 오전 9시 (UTC 기준 0시) 정기 스캔
    - cron: '0 0 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config: |
            paths-ignore:
              - design_handoff_auth_flow

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: '/language:${{ matrix.language }}'

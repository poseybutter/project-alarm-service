name: Release and notify

on:
  push:
    branches: [main]

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Read and validate package version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version in package.json: $VERSION" >&2
            exit 1
          fi

          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping this release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Preparing release $TAG"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Collect release changes
        if: steps.version.outputs.changed == 'true'
        id: changes
        shell: bash
        run: |
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$PREVIOUS_TAG" ]; then
            MESSAGES="$(git log --pretty=format:'- %s' "$PREVIOUS_TAG..${{ github.sha }}")"
          else
            MESSAGES="$(git log --pretty=format:'- %s' "${{ github.sha }}")"
          fi

          if [ -z "$MESSAGES" ]; then
            MESSAGES="- Release v${{ steps.version.outputs.version }}"
          fi

          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$MESSAGES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Insert service notification
        if: steps.version.outputs.changed == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          BODY: ${{ steps.changes.outputs.body }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets are required." >&2
            exit 1
          fi

          PAYLOAD="$(jq -n \
            --arg version "v$VERSION" \
            --arg title "v$VERSION 업데이트" \
            --arg body "$BODY" \
            --arg commit_sha "$SHA" \
            '{version: $version, title: $title, body: $body, commit_sha: $commit_sha}')"

          curl --fail-with-body --silent --show-error \
            --request POST "$SUPABASE_URL/rest/v1/notifications" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data "$PAYLOAD"

      - name: Create Git tag and GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
          BODY: ${{ steps.changes.outputs.body }}
        shell: bash
        run: |
          git tag "$TAG" "${{ github.sha }}"
          git push origin "$TAG"
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --notes "$BODY"

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # main 으로 바로 머지되면 develop 과 어긋나 역머지가 필요해진다.
    # develop 으로 받아 승격 PR 로 함께 main 에 반영한다.
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    # 메이저 업그레이드는 하위 호환이 깨질 수 있어 자동 PR을 만들지 않는다.
    # 필요할 때 직접 올리고 빌드·동작을 확인한다.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

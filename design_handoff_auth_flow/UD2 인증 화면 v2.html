code={`"use client";
import { useState } from "react";
import { useRouter } from "next/navigation";

export default function LoginPage() {
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [err, setErr] = useState<string | null>(null);
  const [loading, setLoading] = useState(false);

  async function onSubmit(e: React.FormEvent) {
    e.preventDefault();

    const r = await fetch("/api/auth/login", {
      method: "POST",

    });
    setLoading(false);
    if (r.status === 403) return router.push("/pending");
    if (!r.ok) return setErr("이메일 또는 비밀번호가 일치하지 않습니다.");
    router.push("/quests");

  return (

        <Block title="app/api/auth/login/route.ts — Spring 프록시"
code={`import { NextResponse } from "next/server";
import { cookies } from "next/headers";

export async function POST(req: Request) {
  const body = await req.json();

  // 1) Spring Boot 인증 호출
  const r = await fetch(\`\${process.env.SPRING_API}/auth/login\`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!r.ok) return new NextResponse(null, { status: r.status });

  // 2) JWT는 HttpOnly 쿠키로 — XSS로 토큰 탈취 방어
  const { access, refresh, status } = await r.json();
  cookies().set("ud2_at", access, {
    httpOnly: true, secure: true, sameSite: "lax",
    maxAge: 60 * 30, path: "/",
  });
  cookies().set("ud2_rt", refresh, {
    httpOnly: true, secure: true, sameSite: "lax",
    maxAge: 60 * 60 * 24 * 14, path: "/",
  });

  // 3) pending은 403 — 클라가 /pending으로 라우팅
  if (status === "pending") return new NextResponse(null, { status: 403 });
  return NextResponse.json({ ok: true });
}`} />
        <Block title="middleware.ts — 보호 라우트 + status 체크"
code={`import { NextResponse, type NextRequest } from "next/server";
import { jwtVerify } from "jose";

const PUBLIC = ["/login", "/signup", "/pending"];

export async function middleware(req: NextRequest) {
  const { pathname } = req.nextUrl;
  if (PUBLIC.some(p => pathname.startsWith(p))) return NextResponse.next();

  const token = req.cookies.get("ud2_at")?.value;
  if (!token) return NextResponse.redirect(new URL("/login", req.url));

  try {
    const { payload } = await jwtVerify(
      token,
      new TextEncoder().encode(process.env.JWT_SECRET!)
    );
    if (payload.status === "pending")
      return NextResponse.redirect(new URL("/pending", req.url));
    if (payload.role !== "admin" && pathname.startsWith("/admin"))
      return NextResponse.redirect(new URL("/quests", req.url));
    return NextResponse.next();
  } catch {
    return NextResponse.redirect(new URL("/login", req.url));
  }
}

export const config = { matcher: ["/((?!_next|api|favicon).*)"] };`} />
        <Block title="components/InviteCode.tsx — 4+4 입력"
code={`"use client";
import { useRef } from "react";

export function InviteCode({ value, onChange, error }: {
  value: [string, string];
  onChange: (v: [string, string]) => void;
  error?: string | null;
}) {
  const r0 = useRef<HTMLInputElement>(null);
  const r1 = useRef<HTMLInputElement>(null);

  const set = (i: 0 | 1, v: string) => {
    const clean = v.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
    const next: [string, string] = [...value]; next[i] = clean;
    onChange(next);
    if (clean.length === 4 && i === 0) r1.current?.focus();
  };

  const cls = (filled: boolean) =>
    \`flex-1 h-16 text-center font-bold text-2xl tracking-[0.18em] uppercase
     rounded-xl bg-white outline-none transition-all border font-mono
     \${error ? "border-red-400 ring-4 ring-red-100"
       : filled ? "border-amber-400 ring-4 ring-amber-100"
       : "border-stone-200"}\`;

  return (
    <div className="flex items-center gap-3">
      <input ref={r0} value={value[0]} onChange={e => set(0, e.target.value)}
        maxLength={4} placeholder="XXXX" autoFocus className={cls(value[0].length === 4)} />
      <span className="text-stone-300 font-bold text-xl">—</span>
      <input ref={r1} value={value[1]} onChange={e => set(1, e.target.value)}
        maxLength={4} placeholder="XXXX" className={cls(value[1].length === 4)} />
    </div>
  );
}`} />
        <Block title="app/(auth)/pending/page.tsx — 자동 폴링"
code={`"use client";
import { useEffect } from "react";
import { useRouter } from "next/navigation";

export default function PendingPage() {
  const router = useRouter();
  useEffect(() => {
    const id = setInterval(async () => {
      const r = await fetch("/api/auth/me");
      const me = await r.json();
      if (me.status === "active") router.push("/quests");
      if (me.status === "rejected") router.push("/login?rejected=1");
    }, 15000); // 15초 — 부하 vs UX 균형
    return () => clearInterval(id);
  }, []);

  // 클라이언트에서 실시간으로 elapsed 시간 갱신
  // PendingScreen 컴포넌트는 v2/screens/pending.jsx 재사용
  return <PendingScreen />;
}`} />
        <Block title="app/api/admin/members/[id]/approve/route.ts"
code={`import { NextResponse } from "next/server";
import { cookies } from "next/headers";

// POST /api/admin/members/:id/approve
export async function POST(_: Request, { params }: { params: { id: string } }) {
  const at = cookies().get("ud2_at")?.value;
  if (!at) return new NextResponse(null, { status: 401 });

  const r = await fetch(
    \`\${process.env.SPRING_API}/admin/members/\${params.id}/approve\`,
    { method: "POST", headers: { Authorization: \`Bearer \${at}\` } }
  );
  if (!r.ok) return new NextResponse(null, { status: r.status });

  // Spring 측에서 audit_log에 자동 기록 (누가, 누구를, 언제, IP)
  // + 새 멤버에게 알림(이메일/슬랙) 발송
  return NextResponse.json(await r.json());
}`} />
